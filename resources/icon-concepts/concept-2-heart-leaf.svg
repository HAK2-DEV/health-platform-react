<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 시안 2: 하트 + 잎사귀 결합 — 건강(♥) + 성장(🌿) -->
  <!-- 의미 강함. 단, 시안 1 보다 디테일 많아 32px 에서 살짝 답답할 수도 -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg2)"/>
  <g transform="translate(512 532)">
    <!-- 하트 본체 -->
    <path d="M 0,260
             C -100,180 -260,80 -260,-60
             C -260,-160 -180,-240 -80,-240
             C -30,-240 10,-220 40,-180
             C 70,-220 110,-240 160,-240
             C 260,-240 340,-160 340,-60
             C 340,80 180,180 80,260
             L 40,290 Z"
          fill="#ffffff" opacity="0.96"/>
    <!-- 잎사귀 — 하트 위에 살짝 -->
    <g transform="translate(80 -260) rotate(20)">
      <path d="M 0,0
               C -40,-20 -50,-70 -20,-110
               C 10,-150 70,-160 110,-130
               C 80,-100 50,-80 30,-50
               C 15,-25 5,-10 0,0 Z"
            fill="#10b981"/>
      <!-- 잎맥 -->
      <path d="M -10,-10 Q 30,-50 80,-110" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>
</svg>
