<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 도담 — "함께 자라는 잎" 새싹 심볼 (Emerald Refresh). favicon + apple-touch + PWA 아이콘 + 헤더 공용 -->
  <defs>
    <linearGradient id="dodamBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- 풀블리드 배경 (maskable 안전 + iOS 자동 라운딩) -->
  <rect width="1024" height="1024" fill="url(#dodamBg)"/>
  <!-- 잎 3장 (흰색) -->
  <g transform="translate(512 560)" fill="#ffffff">
    <path d="M 0,120 C -70,40 -70,-120 0,-230 C 70,-120 70,40 0,120 Z" opacity="0.98"/>
    <path d="M -28,130 C -150,80 -210,-30 -225,-150 C -110,-130 -10,-40 18,110 Z" opacity="0.9"/>
    <path d="M 28,130 C 150,80 210,-30 225,-150 C 110,-130 10,-40 -18,110 Z" opacity="0.9"/>
  </g>
  <!-- 공통 줄기 -->
  <g transform="translate(512 560)" stroke="#ffffff" stroke-width="34" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M 0,120 L 0,230"/>
  </g>
  <!-- 중앙 잎맥 -->
  <g transform="translate(512 560)" stroke="#059669" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.3">
    <path d="M 0,90 L 0,-170"/>
  </g>
</svg>
